<!DOCTYPE HTML>
<html>
<head>
<script src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8"></script>
  <script src="math.js" type="text/javascript"></script>
</head>
<body>
    <!-- Контейнер, где Plotly нарисует график -->
    <div id="plot" style="width:100%; max-width:800px; height:500px; margin: 0 auto;"></div>
    <script>
        // 1. Создаем диапазон значений X от -2*PI до 2*PI с шагом 0.1
        const xValues = math.range(-2 * math.pi, 2 * math.pi, 0.1).toArray();

        // 2. Вычисляем значения Y для функции y = 2*sin(x - pi/6) + 1
        const yValues = xValues.map(function (x) {
            return 2 * math.sin(x - math.pi / 6) + 1;
        });

        // 3. Настраиваем данные для графика
        const trace = {
            x: xValues,
            y: yValues,
            type: 'scatter',
            mode: 'lines',
            name: 'y = 2*sin(x - π/6) + 1',
            line: { color: '#1f77b4', width: 3 }
        };

        // 4. Настраиваем внешний вид (сетка, оси, название)
        const layout = {
            title: 'График функции y = 2*sin(x - π/6) + 1',
            xaxis: {
                title: 'Ось X (Радианы)',
                zeroline: true,
                gridcolor: '#e2e2e2'
            },
            yaxis: {
                title: 'Ось Y',
                zeroline: true,
                gridcolor: '#e2e2e2'
            },
            plot_bgcolor: '#fafafa'
        };

        // 5. Отрисовываем график в div-контейнере с id="plot"
        Plotly.newPlot('plot', [trace], layout);
    </script>
</body>
</html>
